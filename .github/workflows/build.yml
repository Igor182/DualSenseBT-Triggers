name: Build Windows x64 Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File EXE (win-x64)
        run: |
          dotnet publish DualSenseBT-Triggers.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish/win-x64

      - name: Upload DualSenseBT-Triggers.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseBT-Triggers-win-x64
          path: ./publish/win-x64/DualSenseBT-Triggers.exe
